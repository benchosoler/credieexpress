<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Floor shadow -->
  <ellipse cx="400" cy="540" rx="220" ry="15" fill="#000" opacity="0.15"/>
  <!-- Vertical posts -->
  <rect x="180" y="60" width="12" height="470" fill="url(#shelf)"/>
  <rect x="608" y="60" width="12" height="470" fill="url(#shelf)"/>
  <!-- Shelves (5 levels) -->
  <rect x="175" y="120" width="450" height="14" fill="url(#shelf)" stroke="#475569" stroke-width="1"/>
  <rect x="175" y="220" width="450" height="14" fill="url(#shelf)" stroke="#475569" stroke-width="1"/>
  <rect x="175" y="320" width="450" height="14" fill="url(#shelf)" stroke="#475569" stroke-width="1"/>
  <rect x="175" y="420" width="450" height="14" fill="url(#shelf)" stroke="#475569" stroke-width="1"/>
  <rect x="175" y="520" width="450" height="14" fill="url(#shelf)" stroke="#475569" stroke-width="1"/>
  <!-- Box shapes on shelves (products) -->
  <!-- Top shelf -->
  <rect x="220" y="76" width="50" height="44" fill="#dc2626" opacity="0.85"/>
  <rect x="280" y="72" width="55" height="48" fill="#1E90FF" opacity="0.85"/>
  <rect x="345" y="78" width="48" height="42" fill="#00C853" opacity="0.85"/>
  <rect x="403" y="74" width="52" height="46" fill="#fbbf24" opacity="0.85"/>
  <rect x="465" y="78" width="50" height="42" fill="#7c3aed" opacity="0.85"/>
  <rect x="525" y="76" width="48" height="44" fill="#0891b2" opacity="0.85"/>
  <!-- 2nd shelf -->
  <rect x="220" y="176" width="55" height="44" fill="#ea580c" opacity="0.85"/>
  <rect x="285" y="180" width="50" height="40" fill="#1E90FF" opacity="0.85"/>
  <rect x="345" y="178" width="52" height="42" fill="#00C853" opacity="0.85"/>
  <rect x="407" y="182" width="48" height="38" fill="#dc2626" opacity="0.85"/>
  <rect x="465" y="178" width="55" height="42" fill="#7c3aed" opacity="0.85"/>
  <rect x="530" y="180" width="50" height="40" fill="#fbbf24" opacity="0.85"/>
  <!-- 3rd shelf -->
  <rect x="222" y="276" width="48" height="44" fill="#0891b2" opacity="0.85"/>
  <rect x="280" y="278" width="55" height="42" fill="#1E90FF" opacity="0.85"/>
  <rect x="345" y="280" width="50" height="40" fill="#dc2626" opacity="0.85"/>
  <rect x="405" y="276" width="52" height="44" fill="#00C853" opacity="0.85"/>
  <rect x="467" y="280" width="48" height="40" fill="#7c3aed" opacity="0.85"/>
  <rect x="525" y="278" width="55" height="42" fill="#ea580c" opacity="0.85"/>
  <!-- 4th shelf -->
  <rect x="220" y="376" width="55" height="44" fill="#fbbf24" opacity="0.85"/>
  <rect x="285" y="378" width="48" height="42" fill="#1E90FF" opacity="0.85"/>
  <rect x="343" y="380" width="52" height="40" fill="#00C853" opacity="0.85"/>
  <rect x="405" y="376" width="50" height="44" fill="#dc2626" opacity="0.85"/>
  <rect x="465" y="380" width="48" height="40" fill="#0891b2" opacity="0.85"/>
  <rect x="523" y="378" width="55" height="42" fill="#7c3aed" opacity="0.85"/>
