  <rect x="222" y="476" width="50" height="44" fill="#1E90FF" opacity="0.85"/>
  <rect x="282" y="480" width="55" height="40" fill="#dc2626" opacity="0.85"/>
  <rect x="347" y="478" width="48" height="42" fill="#00C853" opacity="0.85"/>
  <rect x="405" y="482" width="52" height="38" fill="#7c3aed" opacity="0.85"/>
  <rect x="467" y="478" width="48" height="42" fill="#fbbf24" opacity="0.85"/>
  <rect x="525" y="480" width="50" height="40" fill="#ea580c" opacity="0.85"/>
  <!-- Cross brace -->
  <line x1="192" y1="60" x2="608" y2="60" stroke="#475569" stroke-width="2" opacity="0.4"/>
  <line x1="192" y1="540" x2="608" y2="540" stroke="#475569" stroke-width="2" opacity="0.4"/>
  <!-- Title -->
  <text x="400" y="585" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="16" font-weight="700">Estantería Metálica</text>
