<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f4f6"/>
      <stop offset="1" stop-color="#e5e7eb"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Floor -->
  <ellipse cx="400" cy="540" rx="340" ry="15" fill="#000" opacity="0.08"/>
  <!-- Three accessory items on a shelf -->
  <!-- Shopping basket (left) -->
  <g transform="translate(80,200)">
    <ellipse cx="100" cy="290" rx="100" ry="14" fill="#000" opacity="0.15"/>
    <!-- Basket body (wire mesh) -->
    <path d="M 20 100 L 30 280 L 170 280 L 180 100 Z" fill="none" stroke="#0891b2" stroke-width="3"/>
    <!-- Basket handles -->
    <path d="M 50 100 Q 50 50 100 50 Q 150 50 150 100" fill="none" stroke="#0891b2" stroke-width="6"/>
    <!-- Wire mesh pattern -->
    <g stroke="#0891b2" stroke-width="1.5" opacity="0.6">
      <line x1="20" y1="140" x2="180" y2="140"/>
      <line x1="22" y1="170" x2="178" y2="170"/>
      <line x1="24" y1="200" x2="176" y2="200"/>
      <line x1="26" y1="230" x2="174" y2="230"/>
      <line x1="28" y1="260" x2="172" y2="260"/>
      <line x1="40" y1="105" x2="35" y2="280"/>
      <line x1="65" y1="103" x2="62" y2="280"/>
      <line x1="100" y1="100" x2="100" y2="280"/>
      <line x1="135" y1="103" x2="138" y2="280"/>
      <line x1="160" y1="105" x2="165" y2="280"/>
    </g>
    <text x="100" y="320" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="16" font-weight="700">Canasto</text>
  </g>
  <!-- Price labeler (center) -->
  <g transform="translate(290,180)">
    <ellipse cx="110" cy="340" rx="100" ry="12" fill="#000" opacity="0.12"/>
    <!-- Main body -->
    <rect x="50" y="160" width="140" height="60" rx="8" fill="#1E90FF" stroke="#0c4a6e" stroke-width="2"/>
    <!-- Handle -->
    <path d="M 80 160 L 60 100 L 140 100 L 130 160 Z" fill="#0c4a6e"/>
    <!-- Trigger -->
    <rect x="180" y="180" width="40" height="20" rx="3" fill="#1E90FF" stroke="#0c4a6e" stroke-width="2"/>
    <!-- Display screen -->
    <rect x="70" y="170" width="100" height="20" rx="2" fill="#22d3ee"/>
    <text x="120" y="184" text-anchor="middle" fill="#000" font-family="Arial" font-size="11" font-weight="700">$ 1,499</text>
    <!-- Label printer tape -->
    <rect x="40" y="200" width="160" height="20" fill="#fff" stroke="#1E90FF" stroke-width="1"/>
    <text x="120" y="214" text-anchor="middle" fill="#1E90FF" font-family="Arial" font-size="10" font-weight="600">║BARCODE║</text>
    <!-- Print button highlight -->
    <circle cx="160" cy="190" r="4" fill="#fbbf24"/>
    <text x="120" y="320" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="16" font-weight="700">Etiquetadora</text>
  </g>
  <!-- Bag dispenser (right) -->
  <g transform="translate(530,200)">
    <ellipse cx="100" cy="290" rx="100" ry="14" fill="#000" opacity="0.15"/>
    <!-- Post -->
    <rect x="90" y="100" width="20" height="180" fill="#64748b" stroke="#334155" stroke-width="2"/>
    <!-- Top unit (dispenser) -->
    <ellipse cx="100" cy="100" rx="80" ry="14" fill="#475569" stroke="#1e293b" stroke-width="2"/>
    <rect x="20" y="80" width="160" height="40" rx="8" fill="#1E90FF" stroke="#0c4a6e" stroke-width="2"/>
    <ellipse cx="100" cy="80" rx="80" ry="14" fill="#0c4a6e"/>
    <!-- Bags hanging down -->
    <path d="M 30 100 Q 30 200 40 280 L 50 280 L 50 100 Z" fill="#0891b2" opacity="0.8"/>
    <path d="M 60 100 L 60 270 L 100 270 L 100 100 Z" fill="#0e7490" opacity="0.85"/>
    <path d="M 110 100 L 110 280 L 145 280 L 150 100 Z" fill="#0891b2" opacity="0.8"/>
    <path d="M 155 100 L 160 270 L 180 275 L 180 100 Z" fill="#0e7490" opacity="0.75"/>
    <!-- Bag handles -->
    <line x1="60" y1="100" x2="100" y2="105" stroke="#fff" stroke-width="2" opacity="0.6"/>
    <line x1="100" y1="105" x2="140" y2="100" stroke="#fff" stroke-width="2" opacity="0.6"/>
    <!-- Logo/text on dispenser -->
    <text x="100" y="105" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14" font-weight="700">BOLSA</text>
    <text x="100" y="320" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="16" font-weight="700">Dispenser</text>
  </g>
  <!-- Title -->
  <text x="400" y="585" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="18" font-weight="700">Accesorios para tu comercio</text>
</svg>
