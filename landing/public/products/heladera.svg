<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bae6fd"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="0.5" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Floor shadow -->
  <ellipse cx="400" cy="560" rx="280" ry="20" fill="#000" opacity="0.1"/>
  <!-- Main body of the refrigerator -->
  <rect x="220" y="80" width="360" height="470" rx="16" fill="url(#metal)" stroke="#64748b" stroke-width="2"/>
  <!-- Glass door -->
  <rect x="245" y="100" width="310" height="430" rx="8" fill="url(#door)" opacity="0.7"/>
  <!-- Glass reflection -->
  <path d="M 250 105 L 250 380 L 270 360 L 270 105 Z" fill="#ffffff" opacity="0.4"/>
  <!-- Top display sign -->
  <rect x="220" y="60" width="360" height="40" rx="8" fill="#1E90FF"/>
  <text x="400" y="86" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="700">HELADERA</text>
  <!-- Shelves inside -->
  <line x1="270" y1="180" x2="530" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <line x1="270" y1="270" x2="530" y2="270" stroke="#94a3b8" stroke-width="2"/>
  <line x1="270" y1="360" x2="530" y2="360" stroke="#94a3b8" stroke-width="2"/>
  <line x1="270" y1="450" x2="530" y2="450" stroke="#94a3b8" stroke-width="2"/>
  <!-- Items on shelves (bottles/products) -->
  <rect x="290" y="140" width="40" height="40" rx="4" fill="#1E90FF" opacity="0.8"/>
  <rect x="340" y="135" width="35" height="45" rx="4" fill="#00C853" opacity="0.8"/>
  <rect x="385" y="140" width="40" height="40" rx="4" fill="#fbbf24" opacity="0.8"/>
  <rect x="435" y="138" width="38" height="42" rx="4" fill="#dc2626" opacity="0.8"/>
  <rect x="485" y="140" width="35" height="40" rx="4" fill="#7c3aed" opacity="0.8"/>
  <rect x="295" y="230" width="38" height="40" rx="4" fill="#0891b2" opacity="0.8"/>
  <rect x="343" y="232" width="40" height="38" rx="4" fill="#ea580c" opacity="0.8"/>
  <rect x="395" y="230" width="36" height="40" rx="4" fill="#1E90FF" opacity="0.8"/>
  <rect x="443" y="234" width="40" height="36" rx="4" fill="#00C853" opacity="0.8"/>
  <rect x="493" y="232" width="35" height="38" rx="4" fill="#fbbf24" opacity="0.8"/>
  <rect x="290" y="320" width="42" height="40" rx="4" fill="#7c3aed" opacity="0.8"/>
  <rect x="342" y="322" width="38" height="38" rx="4" fill="#dc2626" opacity="0.8"/>
  <rect x="390" y="320" width="40" height="40" rx="4" fill="#0891b2" opacity="0.8"/>
  <rect x="440" y="324" width="38" height="36" rx="4" fill="#ea580c" opacity="0.8"/>
  <rect x="488" y="322" width="40" height="38" rx="4" fill="#1E90FF" opacity="0.8"/>
  <rect x="292" y="410" width="40" height="40" rx="4" fill="#00C853" opacity="0.8"/>
  <rect x="342" y="412" width="36" height="38" rx="4" fill="#fbbf24" opacity="0.8"/>
  <rect x="388" y="410" width="40" height="40" rx="4" fill="#7c3aed" opacity="0.8"/>
  <rect x="438" y="414" width="38" height="36" rx="4" fill="#dc2626" opacity="0.8"/>
  <rect x="486" y="412" width="42" height="38" rx="4" fill="#0891b2" opacity="0.8"/>
  <!-- Door handle -->
  <rect x="555" y="200" width="20" height="200" rx="4" fill="#94a3b8"/>
  <!-- Side panel details -->
  <line x1="220" y1="200" x2="245" y2="200" stroke="#64748b" stroke-width="1"/>
  <line x1="220" y1="430" x2="245" y2="430" stroke="#64748b" stroke-width="1"/>
  <!-- Base/feet -->
  <rect x="240" y="550" width="20" height="10" fill="#475569"/>
  <rect x="540" y="550" width="20" height="10" fill="#475569"/>
  <!-- Label at bottom -->
  <text x="400" y="585" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="16" font-weight="600">Exhibidora comercial</text>
</svg>
